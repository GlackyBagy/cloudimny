spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudimny}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudimny}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

storage:
  s3-endpoint: http://${S3_ENDPOINT}
  s3-accessKey: ${S3_ACCESS_KEY}
  s3-secretKey: ${S3_SECRET_KEY}

app:
  auth-secret: ${AUTH_SECRET}
